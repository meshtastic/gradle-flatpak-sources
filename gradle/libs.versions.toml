[versions]
detekt = "1.23.8"
dokka = "2.2.0"
nmcp = "1.6.2"
# JetBrains gradle-changelog-plugin: parses and renders the hand-written
# CHANGELOG.md. It never generates an entry from a commit.
changelog = "2.5.0"

[plugins]
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }

[libraries]
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
